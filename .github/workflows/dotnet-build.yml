
name: SMART MATH - Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore SMART_MATH_VERSION_TWO.sln

      - name: Build solution
        run: dotnet build SMART_MATH_VERSION_TWO.sln --configuration Release --no-restore
